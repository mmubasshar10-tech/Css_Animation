
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Showcase</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Animation Showcase</h1>
        <p>Explore simple CSS animations and transitions</p>
    </header>

    <main class="animation-container">

        <section class="animation-card">
            <h2>1. Hover Effect</h2>
            <p>Move your mouse over the box.</p>
            <div class="hover-box">Hover Me</div>
        </section>

        <section class="animation-card">
            <h2>2. Moving Box</h2>
            <p>This box moves automatically.</p>
            <div class="moving-box"></div>
        </section>

        <section class="animation-card">
            <h2>3. Loading Spinner</h2>
            <p>This spinner rotates continuously.</p>
            <div class="spinner"></div>
        </section>

        <section class="animation-card">
            <h2>4. Pulsing Circle</h2>
            <p>This circle grows and shrinks.</p>
            <div class="pulse-circle"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
